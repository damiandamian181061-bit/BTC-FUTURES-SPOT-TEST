# The dashboard mirror on a DigitalOcean Droplet: the same image as the laptop, behind Caddy (HTTPS + password).
# On the Droplet, from /opt/btc-strategy/deploy/digitalocean (deploy/digitalocean/do.sh push does all of this):
#   docker compose up -d --build        build the image from the copied code and start app + caddy
#   docker compose logs -f              follow both logs
#   bash set-password.sh                set or change the dashboard login
# Settings come from .env next to this file (written by do.sh push): SITE_ADDRESS=<name the certificate is for>.
#
# What is NOT here, on purpose: no API keys (so /api/accounts answers 503) and no bot. Trading stays on the laptop;
# the laptop copies the candles and paper logs into /srv/btc-data after each scheduled run (do.sh sync), and the app
# reads them read-only.
name: btc-dashboard

services:
  app:
    build:
      context: ../..
    image: btc-strategy-app:latest
    environment:
      BTC_BOT_ROOT: /app
      BTC_BOT_DATA_DIR: /app/data
      BTC_BOT_PAPER_DIR: /app/data/paper
      BTC_BOT_CHARTS_DIR: /app/charts
      BTC_BOT_SECRETS: /run/no-secrets-on-this-server
    volumes:
      - ${DATA_DIR:-/srv/btc-data}:/app/data:ro
    expose:
      - "8000"
    # Shares the Droplet with btc-options-lab: hard caps so this app can never starve it (uses ~160 MB, <1% CPU).
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/digitalocean/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./auth.caddy:/etc/caddy/auth.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

  # The trading bot itself, one command per run (never a long-running container). Started only by bot-run.sh from
  # the deploy user's crontab (bot.crontab), so `docker compose up` never starts it. Same image as the app; it
  # writes the ledgers in /srv/btc-data (the app above reads them read-only) and reads the Binance Demo keys
  # from a file outside the repo, mounted read-only.
  bot:
    profiles: ["bot"]
    image: btc-strategy-app:latest
    environment:
      BTC_BOT_ROOT: /app
      BTC_BOT_DATA_DIR: /app/data
      BTC_BOT_PAPER_DIR: /app/data/paper
      BTC_BOT_CHARTS_DIR: /app/charts
      BTC_BOT_SECRETS: /run/secrets/btc-bot.env
    volumes:
      - ${DATA_DIR:-/srv/btc-data}:/app/data
      - ${BOT_SECRETS_FILE:-/nonexistent}:/run/secrets/btc-bot.env:ro
    mem_limit: 768m
    cpus: 1.0

volumes:
  caddy_data: {}
  caddy_config: {}
