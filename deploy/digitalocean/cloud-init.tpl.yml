#cloud-config
# Droplet first-boot setup for the dashboard mirror (Ubuntu 24.04). Do not paste this template:
# `bash deploy/digitalocean/do.sh keys` fills in the two public keys and writes cloud-init.local.yml (git-ignored),
# which goes in the Droplet's "User data" box.
#   deploy   admin user (sudo, docker), laptop key ~/.ssh/btc_droplet: do.sh push / status / ssh
#   btcsync  can only upload files into /srv/btc-data (rrsync, write-only, no shell): do.sh sync
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - docker-buildx
  - rsync
  - ufw

users:
  - name: deploy
    shell: /bin/bash
    groups: [sudo]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - "__ADMIN_KEY__"
  - name: btcsync
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - 'command="/usr/bin/rrsync -wo -no-del /srv/btc-data",restrict __SYNC_KEY__'

write_files:
  - path: /etc/ssh/sshd_config.d/10-btc-dashboard.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no

runcmd:
  - [bash, -c, "fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab"]
  - [usermod, -aG, docker, deploy]
  - [install, -d, -o, deploy, -g, deploy, -m, "755", /opt/btc-strategy]
  - [install, -d, -o, btcsync, -g, btcsync, -m, "755", /srv/btc-data, /srv/btc-data/paper, /srv/btc-data/paper/logs]
  - [ufw, allow, OpenSSH]
  - [ufw, allow, 80/tcp]
  - [ufw, allow, 443]
  - [ufw, --force, enable]
  - [systemctl, enable, --now, docker]
  - [systemctl, reload, ssh]
